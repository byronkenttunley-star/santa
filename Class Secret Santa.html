<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<title>index.html</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎁%3C/text%3E%3C/svg%3E">
<style>
:root{--g:#14352a;--g2:#1d4a3a;--c:#f6efdc;--r:#b3322f;--gold:#d9b45a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--g);color:var(--c);font:18px/1.6 Georgia,serif;
background-image:radial-gradient(circle at 15% 12%,#ffffff18 2px,transparent 3px),radial-gradient(circle at 75% 55%,#ffffff12 2px,transparent 3px),radial-gradient(circle at 40% 85%,#ffffff14 1.5px,transparent 2.5px);background-size:80px 80px,130px 130px,110px 110px}
main{max-width:480px;margin:0 auto;padding:32px 18px}
h1{font-size:2.1rem;line-height:1.15;margin:0 0 .3em}
.card{background:var(--c);color:var(--g);border-radius:22px;padding:24px;margin-top:18px}
label{font-weight:bold}
input{width:100%;margin-top:8px;padding:15px;border:2px solid var(--g);border-radius:12px;font:inherit;letter-spacing:.06em;text-transform:uppercase;background:#fff;color:#111}
button{width:100%;margin-top:14px;padding:15px;border:0;border-radius:12px;background:var(--r);color:#fff;font:inherit;font-weight:bold;cursor:pointer}
button:disabled{opacity:.55}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.err{margin-top:14px;padding:10px 12px;border-radius:10px;background:#fbe3e1;color:#7d1715;font-weight:bold}
.gift{font-size:6rem;text-align:center;line-height:1.2;cursor:default}
.gift.open{animation:pop .9s ease-out}
@keyframes pop{0%{transform:scale(.5) rotate(-14deg)}60%{transform:scale(1.3) rotate(7deg)}100%{transform:scale(1)}}
.to{font-size:2.4rem;text-align:center;color:var(--r);font-weight:bold;word-break:break-word}
.c{text-align:center}.hide{display:none}
@media (prefers-reduced-motion:reduce){.gift.open{animation:none}}
</style></head><body><main>
<h1>🎄 Class Secret Santa</h1>
<section class="card" id="login">
  <p>Enter the private code you were sent. It only opens your own gift.</p>
  <label for="code">Your access code</label>
  <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXXX-XXXXX-XXXXX-XXXXX-XXXXX-X">
  <button id="go">Open my gift</button>
  <div id="err" class="err hide" role="alert"></div>
</section>
<section class="card hide" id="reveal">
  <p class="c" id="hi"></p>
  <div class="gift" id="gift" aria-hidden="true">🎁</div>
  <button id="show">Reveal My Secret Santa Person</button>
  <div id="res" class="hide"><p class="c">You are Secret Santa for</p><div class="to" id="to" role="status"></div><p class="c">Shh, keep it secret! 🤫</p></div>
</section>
</main>
<script>

const $=id=>document.getElementById(id), te=new TextEncoder(), un=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const norm=c=>c.toUpperCase().replace(/[^A-Z0-9]/g,'');
async function tryEntry(code,e){try{
  const k=await crypto.subtle.importKey('raw',te.encode(norm(code)),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:un(e[0]),iterations:D.iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  const r=await crypto.subtle.decrypt({name:'AES-GCM',iv:un(e[1])},key,un(e[2]));
  return JSON.parse(new TextDecoder().decode(r));}catch(x){return null}}
let found=null;
$('go').onclick=async()=>{
  const code=$('code').value; $('err').classList.add('hide');
  if(norm(code).length<10){$('err').textContent='Enter the full code you were sent.';$('err').classList.remove('hide');return}
  if(!crypto.subtle){$('err').textContent='Open this link in your normal browser (Chrome or Safari).';$('err').classList.remove('hide');return}
  $('go').disabled=true;$('go').textContent='Checking…';
  for(const e of D.e){const r=await tryEntry(code,e);if(r){found=r;break}}
  $('go').disabled=false;$('go').textContent='Open my gift';
  if(!found){$('err').textContent='That code was not recognised. Check it and try again.';$('err').classList.remove('hide');return}
  $('hi').textContent='Hello, '+found.me+'!';$('login').classList.add('hide');$('reveal').classList.remove('hide');$('code').value='';
};
$('show').onclick=()=>{$('to').textContent=found.to;$('res').classList.remove('hide');$('show').classList.add('hide');$('gift').classList.add('open')};
$('code').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});
